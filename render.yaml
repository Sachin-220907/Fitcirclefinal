services:
  - type: web
    name: fitcircle-api
    runtime: node
    buildCommand: npm ci && npm run prisma:generate --workspace backend && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://fitcirclefinal.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 519477137056-64qtmbrabthchrdqerfg6sfpprteb16i.apps.googleusercontent.com
